name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # primp (the DuckDuckGo TLS client) pulls aws-lc-sys, which compiles
  # BoringSSL-derived assembly. On x86_64-pc-windows-msvc that normally needs
  # NASM on PATH; this switches the build to the crate's bundled prebuilt
  # objects (shipped for non-FIPS x86_64-windows), so the Windows job builds
  # with no extra runner tooling. Ignored on macOS/Linux.
  AWS_LC_SYS_PREBUILT_NASM: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            triple: aarch64-apple-darwin
          - name: macOS (Intel)
            # macos-13 (the last default Intel image) was retired on 2025-12-04
            # and its jobs queue forever; macos-15-intel is GitHub's
            # x86_64 image until Aug 2027 (actions/runner-images#13045).
            os: macos-15-intel
            args: --target x86_64-apple-darwin
            triple: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            triple: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-latest
            args: ""
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Same pattern as the official tauri-action template: the action
          # splits this on commas/whitespace, so give it bare triples (a
          # "--target " prefix makes rustup fail with "a value is required
          # for '--target <TARGET>'"). Both mac triples are harmless on
          # either runner; empty on Windows/Linux.
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Tauri build needs these system libraries on Linux.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install JS dependencies
        run: npm ci

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -e "console.log(require('./package.json').version)")" >> "$GITHUB_OUTPUT"

      # A STABLE signature is what makes the Screen Recording grant stick.
      #
      # Without an identity Tauri never runs codesign, so the bundle keeps the
      # linker's ad-hoc signature and its codesign Identifier is a per-build
      # hash (observed: codifa-4ccb3c493826f993 on one build,
      # codifa-7e61d69f49952185 on the next). macOS TCC records a permission
      # against that identity and can never match it again, so Screen Recording
      # is re-asked — or silently denied, which is what made screenshots come
      # back as a bare wallpaper with other apps' windows missing.
      #
      # Guarded instead of unconditional: until the secrets exist this step does
      # nothing and the build stays ad-hoc, exactly as it behaves today.
      - name: Configure macOS signing
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID_VAL: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VAL: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Falls back to the identity name baked into tauri.conf.json, so a
          # build with only the certificate secret still signs with a stable
          # identity instead of silently going ad-hoc.
          DEFAULT_IDENTITY: "Coder Dev Signing"
        run: |
          # With no secrets, export the ad-hoc identity so the hard-coded
          # signingIdentity in tauri.conf.json gets overridden (see below).
          if [ -z "$CERT" ] || [ -z "$CERT_PASSWORD" ]; then
            # tauri.conf.json hard-codes a signing identity, and the bundler
            # runs `codesign -s "Coder Dev Signing"` with it even when no
            # certificate was imported (run #60: "Coder Dev Signing: no
            # identity found"). Exporting the ad-hoc identity "-" overrides
            # the config, keeps codesign passing and matches the linker's
            # default, so behavior is identical to before the config gained
            # the identity field.
            echo "No Apple signing secrets — exporting ad-hoc identity."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          identity="${IDENTITY:-$DEFAULT_IDENTITY}"

          # A dedicated keychain, so the import never touches the runner's login
          # keychain and cannot prompt for a GUI unlock.
          keychain="$RUNNER_TEMP/codifa-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert_path="$RUNNER_TEMP/codifa-signing.p12"

          # The secret is stored base64-encoded because GitHub secrets are text;
          # decode it to a file the import can read, and remove it in the
          # always() step below even if the import fails.
          printf '%s' "$CERT" | base64 --decode > "$cert_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # -A would grant every app access; -T names only codesign and the
          # partition list keeps it from prompting during the build.
          security import "$cert_path" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "$identity"; then
            echo "error: '$identity' is not in the imported certificate." >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi

          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_ID=$APPLE_ID_VAL"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_VAL"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Signing as '$identity'."

      # The decoded private key must not outlive the build's setup step. The
      # shared runner is discarded anyway, but a leaked .p12 in a log or a cache
      # is the one mistake here that cannot be undone.
      - name: Remove the decoded signing certificate
        if: always() && startsWith(matrix.os, 'macos')
        shell: bash
        run: rm -f "$RUNNER_TEMP/codifa-signing.p12"

      # Builds the renderer (npm run build) and both binaries, then creates or
      # updates the GitHub Release for this version with the installers.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.ver.outputs.version }}
          releaseName: v${{ steps.ver.outputs.version }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The WEB/SERVER edition: `codifa serve` is built into the SAME binary
      # the desktop bundles ship, so a release also publishes it ALONE for
      # servers (no installer to unpack). Runs after tauri-action, which has
      # created the release and warmed the cargo cache, so this rebuild is
      # incremental.
      - name: Build and upload the server binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: ${{ matrix.triple }}
        run: |
          cargo build --release --target "$TARGET_TRIPLE" --manifest-path src-tauri/Cargo.toml
          bin="src-tauri/target/$TARGET_TRIPLE/release/codifa"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          if [ ! -f "$bin" ]; then echo "server binary missing: $bin" >&2; exit 1; fi

          cat > SERVER.md <<'EOF'
          # Codifa server (web edition)

          The desktop app, headless — drive it from any browser:

              ./codifa serve --host 0.0.0.0 --port 8787

          Open the printed `?token=...` URL (the token is also saved to
          `~/.codifa/web-token`).

              ./codifa serve --daemon   # run in the background (log: ~/.codifa/serve.log)
              ./codifa stop             # stop the background server

          A packaged frontend is embedded, so no dist folder is needed. Put a
          public deployment behind TLS and keep the token private — the server
          runs commands on its machine. Full docs:
          https://github.com/rhsaman/codifa#-server-mode-use-it-from-a-browser
          EOF

          asset="codifa-server-$TARGET_TRIPLE.zip"
          python3 -m zipfile -c "$asset" "$bin" SERVER.md
          gh release upload "v${{ steps.ver.outputs.version }}" "$asset" --clobber
          echo "uploaded $asset"
