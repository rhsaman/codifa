<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codifa UI test harness</title>
    <script>
      // Stub the Electron preload bridge BEFORE any module loads, so the real
      // renderer code (store, ChatPanel) boots inside a plain browser. Every
      // unknown coder method resolves to null; callers that destructure the
      // result fail inside their own catch / unhandled-rejection path and never
      // break the React tree. This harness tests pure UI behavior — the Python
      // sidecar is intentionally NOT running, so streaming/backend flows are out
      // of scope here.
      (function () {
        var stub = new Proxy(
          {},
          {
            get: function (target, prop) {
              if (prop in target) return target[prop];
              // Every `on*` bridge method is a SUBSCRIPTION: its contract is to
              // return a synchronous unsubscribe (`() => void`, see
              // src/types/coderApi.ts). Resolving those to null like a normal
              // async method makes React call a Promise as an effect cleanup
              // ("off is not a function") and the ErrorBoundary swallows the
              // whole app instead of the one subscription.
              if (typeof prop === 'string' && prop.indexOf('on') === 0) {
                return function () {
                  return function () {};
                };
              }
              return function () {
                return Promise.resolve(null);
              };
            },
          },
        );
        stub.probeSidecar = function () {
          return Promise.resolve(true);
        };
        // A minimal WORKING pty: the right-pane terminal needs terminal_create
        // to resolve a session id, or terminalSessions rejects and xterm never
        // paints — which hid real paint-order bugs (the screen covering the tab
        // bar) from every in-harness check. Captured data callbacks are exposed
        // so a driver can push pty output through window.__ptyData(text).
        var dataCbs = [];
        stub.terminalCreate = function () {
          return Promise.resolve({ id: 'harness-pty-1' });
        };
        stub.terminalWrite = function () { return Promise.resolve(true); };
        stub.terminalResize = function () { return Promise.resolve(true); };
        stub.onTerminalData = function (cb) {
          dataCbs.push(cb);
          return function () {};
        };
        stub.onTerminalExit = function () { return function () {}; };
        window.__ptyData = function (text) {
          dataCbs.forEach(function (cb) { cb('harness-pty-1', text); });
        };
        window.coder = stub;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/tests/ui/harness.tsx"></script>
  </body>
</html>
