name: ✨ Feature request
description: Suggest an idea for Codifa
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting! Please check existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should happen, and how should it feel?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds or other approaches you've tried.