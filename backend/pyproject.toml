[project]
name = "codifa"
version = "1.8.3"
description = "Codifa Coder Agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "faster-whisper>=1.2.1",
    # numpy/torch/transformers/safetensors are still required: the Laya
    # decision classifier and the local TTS weights are torch checkpoints, so
    # only Python can run them. onnxruntime, sqlite-vec, tokenizers,
    # markdownify, ddgs, cryptography and pillow were dropped — the RAG
    # embedder (ort), the vector store (rusqlite), markdown conversion, web
    # search and secret storage are native now.
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.40",
    "safetensors>=0.4",
    "python-multipart>=0.0.32",
    "huggingface-hub>=0.23",
    "pocket-tts @ git+https://github.com/mallahyari/pocket-tts@main",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.9",
    "arabic-reshaper>=3.0.1",
    "python-bidi>=0.6.11",
    "pymupdf>=1.28.2",
    "xlrd>=2.0.2",
]

[tool.ruff]
# Treat the backend package itself as first-party so local modules
# (agents, providers, tools, state_db, vector_store, embeddings, ...)
# are sorted into their own import section instead of being mixed with
# third-party packages. Paths are relative to this file's directory.
src = ["."]
# pytest's tmp_path fixtures (test_build_tree_excludes_skill0 etc.) create
# throwaway source files under tests/pytest-of-<user>/ on every run — never
# lint those.
exclude = ["tests/pytest-of-*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
# The opencode-style suite (tests/test_pure_logic.py, tests/test_agent_behaviors.py)
# uses async test functions; auto mode collects them without decorators.
asyncio_mode = "auto"
testpaths = ["tests"]
# Parallel workers + a hard per-test timeout: the suite is big, and one
# hanging test used to stall the whole serial run indefinitely.
addopts = "-n auto --timeout=60 --durations=15"
