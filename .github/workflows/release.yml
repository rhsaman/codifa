name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump version + tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"

      - name: Guard against release-loop
        id: guard
        run: |
          v="$(node -p "require('./package.json').version")"
          tag="refs/tags/v$v"
          head="$(git rev-parse HEAD)"
          tagsha="$(git rev-parse -q --verify "$tag" || true)"
          if [ "$tagsha" = "$head" ]; then
            echo "v$v already tagged at HEAD — previous bump run; exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.guard.outputs.skip != 'true'
        run: npm version patch --no-git-tag-version

      - name: Commit + tag + push
        id: version
        if: steps.guard.outputs.skip != 'true'
        run: |
          v="$(node -p "require('./package.json').version")"
          git add package.json package-lock.json
          git commit -m "chore(release): v$v"
          git tag "v$v"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main --tags
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    if: needs.bump-version.outputs.version != ''
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: --mac
          - os: windows-latest
            flags: --win
          - os: ubuntu-latest
            flags: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install rsync (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install rsync -y

      - name: Install JS dependencies
        run: npm ci

      - name: Create backend virtualenv (uv sync)
        run: npm run setup

      - name: Build renderer + electron
        run: npm run build

      - name: Package (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.flags }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: needs.bump-version.outputs.version != ''
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.version }}
          generate_release_notes: true
          files: release-assets/**