name: 🐛 Bug report
description: Report a bug to help us improve Codifa
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report! Please search existing issues first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open Codifa and load a folder
        2. Switch to Coder mode
        3. Send a message that ...
        4. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant terminal output (from `npm run dev`), app logs from the data path (`~/.codifa`), or screenshots.
  - type: input
    id: version
    attributes:
      label: Codifa version
      description: e.g. 1.4.2 (see package.json or the About dialog)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options:
        - OpenRouter
        - OpenAI-compatible API
        - Local (Ollama / llama.cpp / vLLM)
        - Not applicable