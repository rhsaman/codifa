[package]
name = "codifa"
version = "1.8.3"
description = "Offline-first AI coding assistant"
authors = ["rhsaman"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
open = "5"
portable-pty = "0.8"
arboard = "3"
screenshots = "0.8"
image = "0.25"
rand = "0.8"
base64 = "0.22"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
libc = "0.2"
# Phase 2: native HTTP router (light endpoints) + proxy to the Python sidecar
axum = { version = "0.7", features = ["http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "process", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Phase 3-2: native agent tools (read/grep/glob/write/edit/terminal)
regex = "1"
walkdir = "2"
tokio-stream = "0.1"
# Native in-app browser: Chromium is driven over the CDP WebSocket protocol
# (navigate/screenshot/click/type), which reqwest cannot speak.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Scheduler loop: cron math needs civil-time date fields (UTC).
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# `tauri dev` runs a DEBUG build, and that build is what made the machine
# stutter: with ~10 crates compiling in parallel, rustc alone peaked at ~1.4 GB.
# Two knobs fix it without giving up usable dev runtime:
#
# * `debug = 1` — full DWARF is the single biggest codegen memory consumer
#   (every generic instantiation keeps its debug info in RAM). Line tables keep
#   backtraces readable for a fraction of the cost, and dependencies drop debug
#   info entirely.
# * `opt-level = 1` — the previous `2` ran the full optimizer on every
#   dependency (tauri, tokio, reqwest, rusqlite, image, ...), which is what
#   pushed individual rustc processes to 150-250 MB. Level 1 keeps the
#   store/JSON/PTY hot paths fast enough that dev does not feel sluggish.
[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
debug = false

[dev-dependencies]
tower = "0.5.3"
