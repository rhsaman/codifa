[package]
name = "codifa"
version = "1.8.4"
description = "Offline-first AI coding assistant"
authors = ["rhsaman"]
license = "MIT"
edition = "2021"

# The app ships as the `codifa` binary; this lib is the SAME module tree behind
# a `lib` target so benches/examples (`agent_bench`) can call `agent::run_turn`
# headless. `src/lib.rs` mirrors `main.rs`'s module list.
[lib]
name = "codifa"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking", "multipart"] }
futures-util = "0.3"
open = "5"
portable-pty = "0.8"
arboard = "3"
screenshots = "0.8"
image = "0.25"
rand = "0.8"
base64 = "0.22"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
libc = "0.2"
# Phase 2: native HTTP router (light endpoints) + proxy to the Python sidecar
axum = { version = "0.7", features = ["http1", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "process", "time", "sync"] }
# Phase 3-2: native agent tools (read/grep/glob/write/edit/terminal)
regex = "1"
tokio-stream = "0.1"
# Native in-app browser: Chromium is driven over the CDP WebSocket protocol
# (navigate/screenshot/click/type), which reqwest cannot speak.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Scheduler loop: cron math needs civil-time date fields (local time).
chrono = "0.4"

# Desktop control needs what the `screenshots` crate cannot do: read the cursor
# position, preflight the Screen Recording permission (macOS silently returns an
# image with every OTHER app's windows removed without it) and inject mouse
# events — drag, right-click and a real scroll wheel are impossible through
# System Events. `highsierra` is required for CGEventCreateScrollWheelEvent2,
# the only scroll constructor Rust can call (the other one is variadic).
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23.2", features = ["highsierra"] }
# DuckDuckGo's HTML endpoint refuses a plain TLS client (anti-bot challenge /
# handshake timeout — verified with curl, reqwest and httpx alike). The Python
# `ddgs` package solves this with `primp`'s browser TLS impersonation, and
# `primp` is itself a Rust crate, so the keyless engine uses it directly.
# Tavily keeps using reqwest; primp is only for DuckDuckGo.
primp = { version = "2", default-features = false, features = ["gzip", "brotli", "deflate", "cookies", "form"] }
pdf-extract = "0.12.1"
calamine = "0.36.1"
csv = "1.4.0"
roxmltree = "0.21.1"
zip = "9.0.5"
aes-gcm = "0.10"

# Release profile tuned for an 8 GB machine.
#
# `lto = true` (fat LTO) + `codegen-units = 1` builds the whole crate graph as a
# single codegen unit, which means rustc/LTO holds every monomorphised body and
# object file in RAM at once. On this project (bundled SQLite, rustls, tauri,
# image) that peaked past physical memory and the machine fell back to 20 GB of
# swap. THIN LTO keeps cross-crate inlining but
# processes modules independently, so the peak stays a fraction of fat LTO while
# the produced code is close in quality (a few percent slower at most).
#
# `codegen-units = 4` lets codegen run in parallel instead of one giant unit,
# which both lowers the peak (no single multi-GB rustc) and shortens the build.
# Raise back to 1 or switch `lto = true` only when building on a >= 16 GB host.
[profile.release]
# NOTE: `panic = "abort"` was removed on purpose. With abort, a panic in ANY
# spawned thread (the writer thread, the axum router, the scheduler, an MCP
# stdio pump) killed the whole process instantly — no CloseRequested event, so
# the quit-flush handshake never ran and up to 150ms of coalesced store writes
# were lost (reported as "the app suddenly closed and my recent chats are
# gone"). Unwinding confines a panic to its own thread, letting the app keep
# running (the recovery paths in store.rs handle a poisoned lock).
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true

# `tauri dev` runs a DEBUG build, and that build is what made the machine
# stutter: with ~10 crates compiling in parallel, rustc alone peaked at ~1.4 GB.
# Two knobs fix it without giving up usable dev runtime:
#
# * `debug = 1` — full DWARF is the single biggest codegen memory consumer
#   (every generic instantiation keeps its debug info in RAM). Line tables keep
#   backtraces readable for a fraction of the cost, and dependencies drop debug
#   info entirely.
# * `opt-level = 1` — the previous `2` ran the full optimizer on every
#   dependency (tauri, tokio, reqwest, rusqlite, image, ...), which is what
#   pushed individual rustc processes to 150-250 MB. Level 1 keeps the
#   store/JSON/PTY hot paths fast enough that dev does not feel sluggish.
[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
debug = false

[dev-dependencies]
tower = "0.5.3"
