[project]
name = "codifa"
version = "0.1.0"
description = "Codifa Coder Agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "ddgs>=9.14.4",
    "cryptography>=42.0.0",
    "faster-whisper>=1.2.1",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "sqlite-vec>=0.1.9",
    "markdownify>=0.13.1",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "mcp>=2.1.1",
    "tree-sitter>=0.26.0",
    "grep-ast>=0.9.0",
    "networkx>=3.4.2",
    "scipy>=1.15.3",
]

[tool.ruff]
# Treat the backend package itself as first-party so local modules
# (agents, providers, tools, state_db, vector_store, embeddings, ...)
# are sorted into their own import section instead of being mixed with
# third-party packages. Paths are relative to this file's directory.
src = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
# The opencode-style suite (tests/test_pure_logic.py, tests/test_agent_behaviors.py)
# uses async test functions; auto mode collects them without decorators.
asyncio_mode = "auto"
testpaths = ["tests"]
